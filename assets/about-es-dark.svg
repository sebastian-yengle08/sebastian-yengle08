<svg xmlns="http://www.w3.org/2000/svg" width="830" height="156" viewBox="0 0 830 156">
<defs></defs>
<rect x="1" y="1" width="828" height="154" rx="12" fill="#161b22" stroke="#30363d"/><rect x="1" y="14" width="5" height="128" rx="2.5" fill="#58a6ff"><animate attributeName="fill" values="#58a6ff;#d2a8ff;#58a6ff" dur="5s" repeatCount="indefinite"/></rect><text x="30" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#58a6ff" opacity="0">Estudiante de Ingeniería de Sistemas e Inteligencia Artificial en la UPAO (Trujillo, Perú).<animate attributeName="opacity" from="0" to="1" begin="0.20s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.20s" dur="0.6s" fill="freeze"/></text><text x="30" y="69" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#e6edf3" opacity="0">Construyo soluciones con IA para problemas reales: un asistente para una clínica dental,<animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.55s" dur="0.6s" fill="freeze"/></text><text x="30" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#e6edf3" opacity="0">un tutor para niños de primaria y una plataforma que ayuda a detectar hallazgos<animate attributeName="opacity" from="0" to="1" begin="0.90s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.90s" dur="0.6s" fill="freeze"/></text><text x="30" y="123" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#e6edf3" opacity="0">arqueológicos en obras. Lidero equipos de desarrollo y proyectos de impacto social.<animate attributeName="opacity" from="0" to="1" begin="1.25s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="1.25s" dur="0.6s" fill="freeze"/></text>
</svg>
